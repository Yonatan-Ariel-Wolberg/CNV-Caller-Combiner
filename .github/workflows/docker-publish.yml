name: Build and Publish Docker Images

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ---------------------------------------------------
      # 1. Build and push the ICAv2 CLI Image
      # ---------------------------------------------------
      - name: Build and push icav2 image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: containers/Dockerfile.icav2
          push: true
          # FORMAT: username/repository_name:specific_tag
          tags: |
            ywolberg/cnv-caller-combiner:icav2-cli-2.43.0
            ywolberg/cnv-caller-combiner:icav2-cli

      - name: Scan icav2 image with Docker Scout
        uses: docker/scout-action@v1
        with:
          command: quickview,cves
          image: ywolberg/cnv-caller-combiner:icav2-cli
          only-severities: critical,high
        continue-on-error: true

      # ---------------------------------------------------
      # 2. Build and push the CatBoost / ML Train Image
      # ---------------------------------------------------
      - name: Build and push train image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: containers/Dockerfile.train
          push: true
          # FORMAT: username/repository_name:specific_tag
          tags: |
            ywolberg/cnv-caller-combiner:catboost-train-1.0.0
            ywolberg/cnv-caller-combiner:catboost-train
            ywolberg/cnv-caller-combiner:catboost-optuna-train
            ywolberg/cnv-caller-combiner:train-xgboost-1.0.0
            ywolberg/cnv-caller-combiner:train-xgboost

      - name: Scan train image with Docker Scout
        uses: docker/scout-action@v1
        with:
          command: quickview,cves
          image: ywolberg/cnv-caller-combiner:catboost-train
          only-severities: critical,high
        continue-on-error: true

      # ---------------------------------------------------
      # 3. Build and push the SeeNV Visualizer Image
      # ---------------------------------------------------
      - name: Build and push seenv image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: containers/Dockerfile.seenv
          push: true
          # FORMAT: username/repository_name:specific_tag
          tags: |
            ywolberg/cnv-caller-combiner:seenv-visualizer-1.0.0
            ywolberg/cnv-caller-combiner:seenv-visualizer

      - name: Scan seenv image with Docker Scout
        uses: docker/scout-action@v1
        with:
          command: quickview,cves
          image: ywolberg/cnv-caller-combiner:seenv-visualizer
          only-severities: critical,high
        continue-on-error: true
